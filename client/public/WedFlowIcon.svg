<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <!-- Bold gold gradient matching the enhanced icon -->
    <linearGradient id="g" x1="15%" y1="15%" x2="85%" y2="85%">
      <stop offset="0%"   stop-color="#FCE38A"/>
      <stop offset="45%"  stop-color="#F0C419"/>
      <stop offset="100%" stop-color="#9A7000"/>
    </linearGradient>

    <!-- Brighter gold for the sparkle -->
    <linearGradient id="gs" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#FFF3B0"/>
      <stop offset="100%" stop-color="#F0C419"/>
    </linearGradient>

    <!-- Clip: shows only the bottom half of the right ring (drawn on top of left) -->
    <clipPath id="c">
      <rect x="0" y="60" width="100" height="40"/>
    </clipPath>

    <!-- Rounded-corner mask for the whole icon (no background fill) -->
    <clipPath id="corners">
      <rect x="1" y="1" width="98" height="98" rx="20"/>
    </clipPath>

    <!-- Soft gold drop-shadow -->
    <filter id="f" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#7A5600" flood-opacity="0.35"/>
    </filter>

    <!-- Lighter shadow for sparkle -->
    <filter id="fs" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.8" flood-color="#7A5600" flood-opacity="0.28"/>
    </filter>
  </defs>

  <g clip-path="url(#corners)">
    <!-- ── Wedding Rings ──────────────────────────────────── -->
    <g filter="url(#f)">
      <!-- Right ring – back layer -->
      <circle cx="63" cy="63" r="20" fill="none" stroke="url(#g)" stroke-width="11"/>
      <!-- Left ring – covers right ring in the top half -->
      <circle cx="37" cy="63" r="20" fill="none" stroke="url(#g)" stroke-width="11"/>
      <!-- Right ring bottom – covers left ring in the bottom half (interlocked) -->
      <circle cx="63" cy="63" r="20" fill="none" stroke="url(#g)" stroke-width="11" clip-path="url(#c)"/>
    </g>

    <!-- Metallic shine arcs on each ring (top-left highlight) -->
    <path d="M22.5,47 A20,20 0 0,1 47.5,43.6"
          stroke="#FFF3B0" stroke-width="3" fill="none" opacity="0.85" stroke-linecap="round"/>
    <path d="M48.5,47 A20,20 0 0,1 73.5,43.6"
          stroke="#FFF3B0" stroke-width="3" fill="none" opacity="0.85" stroke-linecap="round"/>

    <!-- ── Diamond Sparkle ───────────────────────────────── -->
    <path d="M50,4 L53.5,12 L61.5,15.5 L53.5,19 L50,27 L46.5,19 L38.5,15.5 L46.5,12 Z"
          fill="url(#gs)" filter="url(#fs)"/>
    <!-- White center highlight -->
    <circle cx="50" cy="15.5" r="2.2" fill="#FFFFFF" opacity="0.9"/>
  </g>
</svg>
